<!DOCTYPE html>
<html>
<head>
    <title>HTML5 APIs Demo</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #dragBox {
            width: 100px;
            height: 100px;
            background-color: red;
            color: white;
            line-height: 100px;
            margin: 20px auto;
            cursor: move;
        }

        #dropArea {
            width: 200px;
            height: 200px;
            border: 2px dashed black;
            margin: auto;
            line-height: 200px;
        }
    </style>
</head>

<body>

<h2>HTML5 APIs Demo</h2>

<!-- Drag and Drop -->
<h3>1. Drag and Drop</h3>

<div id="dragBox" draggable="true" ondragstart="drag(event)">
    Drag Me
</div>

<div id="dropArea" ondragover="allowDrop(event)" ondrop="drop(event)">
    Drop Here
</div>

<!-- Geolocation -->
<h3>2. Geolocation</h3>
<button onclick="getLocation()">Get Location</button>
<p id="location"></p>

<!-- Web Storage -->
<h3>3. Web Storage</h3>
<input type="text" id="username" placeholder="Enter Name">
<button onclick="saveData()">Save</button>
<button onclick="getData()">Get</button>
<p id="result"></p>

<script>
    // Drag and Drop
    function allowDrop(ev) {
        ev.preventDefault();
    }

    function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
    }

    function drop(ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        ev.target.appendChild(document.getElementById(data));
    }

    // Geolocation
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError);
        } else {
            document.getElementById("location").innerHTML = "Geolocation not supported";
        }
    }

    function showPosition(position) {
        document.getElementById("location").innerHTML =
            "Latitude: " + position.coords.latitude +
            "<br>Longitude: " + position.coords.longitude;
    }

    function showError(error) {
        document.getElementById("location").innerHTML = "Permission Denied or Error";
    }

    // Web Storage
    function saveData() {
        var name = document.getElementById("username").value;
        localStorage.setItem("user", name);
        alert("Data Saved");
    }

    function getData() {
        var data = localStorage.getItem("user");
        document.getElementById("result").innerHTML = "Stored Name: " + data;
    }
</script>

</body>
</html>
