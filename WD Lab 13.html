<!DOCTYPE html>
<html>
<head>
    <title>My Simple Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand">My Website</a>
    </div>
</nav>

<!-- Breadcrumb -->
<div class="container mt-3">
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item active">Home</li>
            <li class="breadcrumb-item">Page</li>
        </ol>
    </nav>
</div>

<!-- Simple Buttons + Modal -->
<div class="container mt-3">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#mymodal">
        Open Modal
    </button>
</div>

<!-- Modal -->
<div class="modal" id="mymodal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>My Modal</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                This is simple modal box.
            </div>

        </div>
    </div>
</div>

<!-- Dropdown -->
<div class="container mt-3">
    <div class="dropdown">
        <button class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown">
            Select Option
        </button>

        <ul class="dropdown-menu">
            <li><a class="dropdown-item">Option 1</a></li>
            <li><a class="dropdown-item">Option 2</a></li>
        </ul>
    </div>
</div>

<!-- Accordion -->
<div class="container mt-4">
    <h4>Accordion</h4>

    <div class="accordion">

        <div class="accordion-item">
            <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a1">
                Section 1
            </button>
            <div id="a1" class="collapse show">
                <div class="accordion-body">Content 1</div>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a2">
                Section 2
            </button>
            <div id="a2" class="collapse">
                <div class="accordion-body">Content 2</div>
            </div>
        </div>

    </div>
</div>

<!-- Form -->
<div class="container mt-4">
    <h4>Form</h4>

    <form>
        <input type="text" class="form-control mb-2" placeholder="Enter Name">
        <input type="email" class="form-control mb-2" placeholder="Enter Email">
        <button class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Pagination -->
<div class="container mt-4">
    <ul class="pagination">
        <li class="page-item"><a class="page-link">1</a></li>
        <li class="page-item"><a class="page-link">2</a></li>
        <li class="page-item"><a class="page-link">3</a></li>
    </ul>
</div>

<!-- Footer -->
<div class="bg-dark text-white text-center p-2 mt-4">
    Footer Section
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
