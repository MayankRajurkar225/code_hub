<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Practical</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">My Website</a>
  </div>
</nav>

<!-- Carousel -->
<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="https://picsum.photos/800/300?random=1" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://picsum.photos/800/300?random=2" class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://picsum.photos/800/300?random=3" class="d-block w-100">
    </div>

  </div>
</div>

<!-- Buttons -->
<div class="text-center mt-4">
  <button class="btn btn-primary">Click Me</button>
  <button class="btn btn-success">Submit</button>
</div>

<!-- Cards + Grid -->
<div class="container mt-4">
  <div class="row">

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/200?1" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Card 1</h5>
          <p class="card-text">Sample content</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/200?2" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Card 2</h5>
          <p class="card-text">Sample content</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/200?3" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Card 3</h5>
          <p class="card-text">Sample content</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center mt-4 p-3">
  © 2026 My Website
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
